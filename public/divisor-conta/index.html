<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divisor de conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Divisor de conta</h1>
  </header>
  <main>
    <form id="form-conta" novalidate>
      <label for="total">Valor da conta (R$)</label>
      <input type="number" id="total" name="total" min="0.01" step="0.01" required>

      <label for="pessoas">Número de pessoas</label>
      <input type="number" id="pessoas" name="pessoas" min="1" step="1" required>

      <label for="gorjeta">Gorjeta</label>
      <select id="gorjeta" name="gorjeta">
        <option value="0">Sem gorjeta</option>
        <option value="10">10%</option>
        <option value="15">15%</option>
      </select>

      <button type="submit">Calcular divisão</button>
      <p id="erro" role="alert"></p>
      <p id="resultado" aria-live="polite"></p>
    </form>
  </main>
  <footer>
    <p>Divida a conta do restaurante com facilidade.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
